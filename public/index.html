<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Vibes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-2" aria-hidden="true"></div>

  <main class="page">
    <header class="hero">
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
        <a href="/manage.html">Manage Songs</a>
      </nav>
      <p class="eyebrow">Now Streaming</p>
      <h1>Song Vibes</h1>
      <p class="subtitle">A tiny frontend for your Express API with login, token status checks, and song management.</p>
      <button id="reloadBtn" class="reload-btn" type="button">Refresh Songs</button>
    </header>

    <section class="songs-panel" aria-live="polite">
      <div class="panel-top">
        <h2>Top Tracks</h2>
        <p id="status">Loading songs...</p>
      </div>
      <ul id="songList" class="song-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
