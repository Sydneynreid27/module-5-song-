<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Songs | Song Vibes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <nav class="nav-links">
        <a href="./">Home</a>
        <a href="login.html">Login</a>
      </nav>
      <p class="eyebrow">Protected Area</p>
      <h1>Song Manager</h1>
      <p class="subtitle">Signed in as <strong id="userBadge">...</strong></p>
      <button id="logoutBtn" class="reload-btn" type="button">Logout</button>
    </header>

    <section class="songs-panel">
      <h2>Add Song</h2>
      <form id="addSongForm" class="form-stack">
        <label for="songTitle">Title</label>
        <input id="songTitle" type="text" required>
        <label for="songArtist">Artist</label>
        <input id="songArtist" type="text" required>
        <button class="reload-btn" type="submit">Add Song</button>
      </form>
    </section>

    <section class="songs-panel">
      <h2>Delete Song</h2>
      <form id="deleteSongForm" class="form-stack">
        <label for="songSelect">Pick a song to remove</label>
        <select id="songSelect"></select>
        <button class="danger-btn" type="submit">Delete Selected Song</button>
      </form>
      <p id="songMessage" class="muted-text"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="manage.js"></script>
  <script src="init.js"></script>
</body>
</html>
